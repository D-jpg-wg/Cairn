name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - '.github/workflows/ci.yml'
            main-api:
              - 'services/main-api/**'
              - '.github/workflows/ci.yml'
            bot:
              - 'services/bot/**'
              - '.github/workflows/ci.yml'
            parser:
              - 'services/parser/**'
              - '.github/workflows/ci.yml'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uvx ruff check .

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Generate JWT keys
        if: matrix.service == 'auth'
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -out keys/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in keys/jwt_private.pem -out keys/jwt_public.pem

      - run: uv sync
      - run: uv run pytest --cov=app --cov-report=term

  build:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cairn-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/cairn-${{ matrix.service }}:${{ github.sha }}
