<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cairn</title>
  <style>
    :root {
      --bg: #0f1120;
      --card: #181b2e;
      --card-2: #1f2338;
      --border: #2a2f4a;
      --text: #e7e9f3;
      --muted: #8b90ad;
      --accent: #6c8cff;
      --accent-2: #8a6cff;
      --ok: #3ad29f;
      --err: #ff6b81;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, #243056 0%, transparent 55%),
        radial-gradient(1000px 500px at 110% 10%, #3a2a5e 0%, transparent 50%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .shell { width: 100%; max-width: 400px; }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      text-align: center;
    }
    .logo {
      width: 52px; height: 52px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-weight: 800; font-size: 24px; color: #fff;
      box-shadow: 0 12px 30px rgba(108,140,255,.4);
    }
    .brand h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
    .brand p { color: var(--muted); font-size: 14px; margin: 2px 0 0; }

    .card {
      background: linear-gradient(180deg, var(--card), var(--card-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 26px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: #12152480;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 22px;
    }
    .tab {
      flex: 1;
      padding: 9px 0;
      text-align: center;
      font-size: 14px; font-weight: 600;
      color: var(--muted);
      border-radius: 9px;
      cursor: pointer;
      transition: .18s;
      user-select: none;
    }
    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 18px rgba(108,140,255,.35);
    }

    /* OAuth */
    .oauth {
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: 11px;
      padding: 12px;
      background: #fff;
      color: #1f2330;
      border: none;
      border-radius: 12px;
      font-size: 14.5px; font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }
    .oauth:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,.35); }
    .oauth:active { transform: translateY(0); }
    .oauth svg { width: 18px; height: 18px; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px 2px; }
    .field { margin-bottom: 16px; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f1222;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: .18s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,140,255,.18); }
    .toggle-pw {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px;
    }
    .toggle-pw:hover { color: var(--text); }

    button.primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      font-size: 15px; font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(108,140,255,.35);
      transition: .15s;
      display: flex; align-items: center; justify-content: center; gap: 9px;
    }
    button.primary:hover { transform: translateY(-1px); }
    button.primary:active { transform: translateY(0); opacity: .9; }
    button.primary:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    button.primary.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.45;
      display: none;
      align-items: flex-start;
      gap: 9px;
    }
    .msg.show { display: flex; }
    .msg.ok  { background: rgba(58,210,159,.12); border: 1px solid rgba(58,210,159,.4); color: var(--ok); }
    .msg.err { background: rgba(255,107,129,.1); border: 1px solid rgba(255,107,129,.4); color: var(--err); }
    .msg .ic { flex-shrink: 0; font-weight: 800; }

    .legal { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 18px; line-height: 1.5; }
    .legal a { color: var(--accent); text-decoration: none; }
    .legal a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="logo">C</div>
      <h1>Cairn</h1>
      <p>Войдите, чтобы продолжить</p>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-tab="login">Вход</div>
        <div class="tab" data-tab="register">Регистрация</div>
      </div>

      <button class="oauth" id="google-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.3C29.6 34.7 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.5 5.3C40.9 35.6 44 30.4 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        <span>Продолжить с Google</span>
      </button>

      <div class="divider" id="divider">или через почту</div>

      <form id="form" autocomplete="off">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="••••••••" required minlength="1" />
            <button class="toggle-pw" type="button" id="toggle-pw">Показать</button>
          </div>
        </div>
        <button class="primary" id="submit" type="submit">
          <span class="spinner"></span>
          <span id="submit-label">Войти</span>
        </button>
      </form>

      <div class="msg" id="msg">
        <span class="ic" id="msg-ic"></span>
        <span id="msg-text"></span>
      </div>
    </div>

    <div class="legal">
      Продолжая, вы соглашаетесь с <a href="#">условиями использования</a><br/>
      и <a href="#">политикой конфиденциальности</a>.
    </div>
  </div>

  <script>
    const API = "/api/v1/auth";
    let mode = "login";

    const $ = (id) => document.getElementById(id);
    const form = $("form");
    const msg = $("msg");
    const submitBtn = $("submit");

    // --- переключение вкладок ---
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        if (tab.dataset.tab === mode) return;
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.tab;
        $("submit-label").textContent = mode === "login" ? "Войти" : "Создать аккаунт";
        $("divider").textContent = mode === "login" ? "или через почту" : "или зарегистрируйтесь через почту";
        hideMsg();
      });
    });

    // --- показать/скрыть пароль ---
    $("toggle-pw").addEventListener("click", () => {
      const pw = $("password");
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      $("toggle-pw").textContent = show ? "Скрыть" : "Показать";
    });

    // --- сообщения для пользователя (без технических деталей) ---
    function showMsg(ok, text) {
      msg.className = "msg show " + (ok ? "ok" : "err");
      $("msg-ic").textContent = ok ? "✓" : "!";
      $("msg-text").textContent = text;
    }
    function hideMsg() { msg.className = "msg"; }

    function friendlyError(status) {
      if (status === 401 || status === 400) return "Неверный email или пароль.";
      if (status === 409) return "Аккаунт с такой почтой уже существует.";
      if (status === 422) return "Проверьте правильность email и пароля.";
      if (status === 429) return "Слишком много попыток. Попробуйте чуть позже.";
      return "Что-то пошло не так. Попробуйте ещё раз.";
    }

    // --- вход через Google (OAuth 2.0) ---
    $("google-btn").addEventListener("click", () => {
      window.location.href = `${API}/oauth/google`;
    });

    // --- register / login ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMsg();
      const email = $("email").value.trim();
      const password = $("password").value;

      submitBtn.disabled = true;
      submitBtn.classList.add("loading");

      try {
        const res = await fetch(`${API}/${mode === "login" ? "login" : "register"}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMsg(false, friendlyError(res.status));
          return;
        }

        if (mode === "login") {
          // Токены (access + refresh) уже выставлены в httponly-cookie сервером.
          showMsg(true, "С возвращением! Перенаправляем…");
          window.location.href = "http://localhost:8001/";
        } else {
          showMsg(true, "Аккаунт создан. Теперь войдите.");
          document.querySelector('.tab[data-tab="login"]').click();
          $("email").value = email;
        }
      } catch {
        showMsg(false, "Нет соединения. Проверьте интернет и попробуйте снова.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
