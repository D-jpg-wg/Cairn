[project]
name = "parser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "scrapy>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
