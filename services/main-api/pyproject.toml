[project]
name = "cairn-main-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi>=0.138.0",
    "greenlet>=3.5.2",
    "grpcio>=1.81.1",
    "httpx>=0.28.1",
    "protobuf>=7.35.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "testcontainers>=4.14.2",
    "trafilatura>=2.1.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
