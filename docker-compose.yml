# Общий стек проекта: сервисы auth и main-api со своими БД (database-per-service).
# По мере роста сюда добавятся bot, parser, kafka, redis и т.д.

services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-cairn}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-cairn}
      POSTGRES_DB: ${AUTH_DB_NAME:-cairn_auth}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-cairn} -d ${AUTH_DB_NAME:-cairn_auth}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./services/auth
    depends_on:
      auth-db:
        condition: service_healthy
    # OAuth/session-настройки берём из .env сервиса (GOOGLE_*, SESSION_SECRET,
    # ENVIRONMENT, APP_URL). environment ниже переопределяет пересекающиеся ключи.
    env_file:
      - ./services/auth/.env
    environment:
      APP_NAME: cairn-auth
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-cairn_auth}
      DB_USER: ${AUTH_DB_USER:-cairn}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-cairn}
      # Ключи прокидываются через docker secrets (см. блок secrets ниже).
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
    ports:
      - "${AUTH_PORT:-8000}:8000"
    secrets:
      - jwt_private_key
      - jwt_public_key
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  main-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MAIN_DB_USER:-cairn}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-cairn}
      POSTGRES_DB: ${MAIN_DB_NAME:-cairn_main}
    ports:
      - "${MAIN_DB_PORT:-5433}:5432"
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MAIN_DB_USER:-cairn} -d ${MAIN_DB_NAME:-cairn_main}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${BOT_DB_USER:-cairn}
      POSTGRES_PASSWORD: ${BOT_DB_PASSWORD:-cairn}
      POSTGRES_DB: ${BOT_DB_NAME:-cairn_bot}
    ports:
      - "${BOT_DB_PORT:-5434}:5432"
    volumes:
      - bot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BOT_DB_USER:-cairn} -d ${BOT_DB_NAME:-cairn_bot}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  main-api:
    build: ./services/main-api
    depends_on:
      main-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_NAME: cairn-main-api
      DB_HOST: main-db        # имя сервиса в compose-сети, не localhost
      DB_PORT: 5432           # внутренний порт postgres (5433 — это проброс на хост)
      DB_NAME: ${MAIN_DB_NAME:-cairn_main}
      DB_USER: ${MAIN_DB_USER:-cairn}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:-cairn}
      CELERY_BROKER_URL: redis://redis:6379/0   # web-процесс ставит задачи в очередь
      # main-api только ПРОВЕРЯЕТ JWT — нужен лишь публичный ключ auth-сервиса.
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEARCH_GRPC_ADDR: search:50051
    ports:
      - "${MAIN_PORT:-8001}:8000"   # 8000 уже занят auth — наружу отдаём 8001
    secrets:
      - jwt_public_key
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cairn
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  search:
    build: ./services/search
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      APP_NAME: cairn-search
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    restart: unless-stopped

  main-api-worker:
    build: ./services/main-api
    depends_on:
      main-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: cairn-main-api
      DB_HOST: main-db
      DB_PORT: 5432
      DB_NAME: ${MAIN_DB_NAME:-cairn_main}
      DB_USER: ${MAIN_DB_USER:-cairn}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:-cairn}
      CELERY_BROKER_URL: redis://redis:6379/0
    entrypoint: [ ]
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped

  main-api-beat:
    build: ./services/main-api
    depends_on:
      main-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: cairn-main-api
      DB_HOST: main-db
      DB_PORT: 5432
      DB_NAME: ${MAIN_DB_NAME:-cairn_main}
      DB_USER: ${MAIN_DB_USER:-cairn}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:-cairn}
      CELERY_BROKER_URL: redis://redis:6379/0
    entrypoint: [ ]
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped

volumes:
  auth-db-data:
  main-db-data:
  bot-db-data:

secrets:
  jwt_private_key:
    file: ./services/auth/keys/jwt_private.pem
  jwt_public_key:
    file: ./services/auth/keys/jwt_public.pem
