# Общий стек проекта. Пока — только БД сервиса auth (database-per-service).
# По мере роста сюда добавятся auth, main-api и их БД, kafka, redis и т.д.

services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-cairn}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-cairn}
      POSTGRES_DB: ${AUTH_DB_NAME:-cairn_auth}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-cairn} -d ${AUTH_DB_NAME:-cairn_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./services/auth
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      APP_NAME: cairn-auth
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-cairn_auth}
      DB_USER: ${AUTH_DB_USER:-cairn}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-cairn}
      # Ключи прокидываются через docker secrets (см. блок secrets ниже).
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
    ports:
      - "${AUTH_PORT:-8000}:8000"
    secrets:
      - jwt_private_key
      - jwt_public_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  auth-db-data:

secrets:
  jwt_private_key:
    file: ./services/auth/keys/jwt_private.pem
  jwt_public_key:
    file: ./services/auth/keys/jwt_public.pem
